server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Data-Driven dataset uploads are capped at 50MB server-side
        # (spring.servlet.multipart.max-file-size); nginx's 1MB default would
        # reject them with a 413 before Spring ever saw the request.
        client_max_body_size 50m;
    }

    # noVNC client + its websocket, served by websockify in the backend
    # container. Keep this mounted at /vnc/ — the client loads from
    # /vnc/vnc.html and then opens /vnc/websockify, so moving the prefix
    # breaks the handshake.
    location /vnc/ {
        proxy_pass http://backend:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A recording session sits idle while the operator reads the page.
        # nginx's 60s default would silently drop the VNC socket mid-recording.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
