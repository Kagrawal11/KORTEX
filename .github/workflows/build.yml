name: build images

# The deployment target is a 1 GB GCP e2-micro, which cannot run `mvn package`
# and `npm ci` without being OOM-killed. Images are therefore built here and
# pulled on the VM. Free for public repositories.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects tags containing uppercase characters, and GitHub
      # usernames commonly have them.
      - name: Compute lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/kortex-${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/kortex-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
