spring.application.name=mini-automation

# ─────────────────────────────────────────────────────────────────────────────
# Database — MySQL
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mini_automation_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=REDACTED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────────────────────────
# Actuator
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─────────────────────────────────────────────────────────────────────────────
# LLM / AI Configuration
# Leave api-key blank to use the built-in heuristic fallback (no LLM calls).
# Set to your OpenAI key to enable AI descriptions and self-healing.
# ─────────────────────────────────────────────────────────────────────────────
mini.automation.llm.api-key=
mini.automation.llm.endpoint=https://api.openai.com/v1/chat/completions
mini.automation.llm.model=gpt-4o-mini
# ─────────────────────────────────────────────────────────────────────────────
# Multipart file upload (for Data-Driven CSV/XLSX)
# ─────────────────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─────────────────────────────────────────────────────────────────────────────
# Email (Execution Report delivery) — "Email Report" button on any report page.
# Every value comes from an environment variable; nothing here is a real
# credential. Leave the environment variables unset to leave email disabled —
# ReportEmailService detects that and returns a clear error instead of trying
# (and failing) to connect to an empty SMTP host.
#
# To enable, set before starting the backend, e.g. (Gmail with an App Password):
#   MINI_AUTOMATION_MAIL_HOST=smtp.gmail.com
#   MINI_AUTOMATION_MAIL_PORT=587
#   MINI_AUTOMATION_MAIL_USERNAME=you@gmail.com
#   MINI_AUTOMATION_MAIL_PASSWORD=<an App Password, not your account password>
#   MINI_AUTOMATION_MAIL_FROM=you@gmail.com   (optional — defaults to the username)
# ─────────────────────────────────────────────────────────────────────────────
spring.mail.host=${MINI_AUTOMATION_MAIL_HOST:}
spring.mail.port=${MINI_AUTOMATION_MAIL_PORT:587}
spring.mail.username=${MINI_AUTOMATION_MAIL_USERNAME:}
spring.mail.password=${MINI_AUTOMATION_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
mini.automation.mail.from=${MINI_AUTOMATION_MAIL_FROM:${MINI_AUTOMATION_MAIL_USERNAME:}}
